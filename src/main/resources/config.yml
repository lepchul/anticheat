# ==========================================================
#  Bastion — античит / антикраш / антилаг
# ==========================================================

messages:
  kick: |
    §c§lВы были замечены в использовании читов.
    §7Лог о вашем поведении был отправлен администратором
  alert: "§8[§cBastion§8] §f%player% §7провалил §c%check% §7(VL %vl%) §8%details%"

general:
  # игроки с bastion.bypass не проверяются
  respect-bypass-permission: true
  # сколько тиков после телепорта/респавна игрок не проверяется движением
  exempt-ticks-after-teleport: 20
  # каждые N секунд VL уменьшается на 1
  vl-decay-seconds: 25
  # писать алерты в консоль
  console-alerts: true

# ---------- ПВП-МЕТКА ----------
pvp-tag:
  enabled: true
  seconds: 30
  bossbar-title: "§cРежим ПВП §7— §f%seconds%с"
  # смерть при выходе в бою
  kill-on-logout: true
  # запрет телепортов во время боя
  block-teleport: true
  # запрет этих команд во время боя (без слэша)
  blocked-commands: [spawn, home, tp, tpa, tpaccept, warp, hub, lobby, rtp, back]

# ---------- КАСТОМНОЕ ЗАЧАРОВАНИЕ ----------
custom-enchants:
  # "Перо" на ботинках = работает как NoFall, проверка NoFall не срабатывает
  feather:
    lore-keyword: "Перо"
    pdc-key: "feather"

