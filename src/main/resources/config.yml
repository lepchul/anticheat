# ---------- ПОРОГИ ДВИЖЕНИЯ ----------
movement:
  # откатывать игрока назад при нарушении (rubber-band). Выключать не советую.
  setback: true

  # --- вертикаль (Fly / InfinityJump / HighJump) ---
  # допуск к предсказанию ванильной физики прыжка, блоков за тик.
  # меньше = строже. Ниже 0.04 начнутся ложняки на лагах.
  vertical-tolerance: 0.06
  # сколько тиков подряд можно висеть с dy=0
  max-hover-ticks: 6

  # --- горизонталь ---
  # средняя скорость за окно, блоков/тик (спринт с прыжками ~0.34)
  max-average-speed: 0.40
  speed-average-ticks: 8
  # мгновенный потолок за один тик
  hard-speed-cap: 0.80

  # --- прочее ---
  # максимальный подъём на блок без прыжка (ваниль 0.6)
  max-step-height: 0.63
  # дальность одного прыжка
  max-jump-distance: 5.2
  # тиков ходьбы по воде до срабатывания
  jesus-ticks: 4
  # набор высоты на элитре без фейерверка
  elytra-max-ascend: 3.5
  elytra-max-speed: 3.5
  # move-пакетов в секунду (ваниль ~20)
  max-move-packets: 25
  # телепорт за один пакет
  max-single-move: 8.0

# ---------- ПОРОГИ БОЯ ----------
combat:
  max-reach-survival: 3.05
  reach-lag-compensation: 0.6
  max-attack-angle: 85.0
  max-cps: 20
  # минимальный интервал натяжения лука (мс)
  min-bow-draw-ms: 120
  # мс между потерей тотема и новым тотемом в левой руке
  min-totem-swap-ms: 120

# ---------- БЛОКИ ----------
blocks:
  max-place-per-second: 12
  max-break-per-second: 12
  # минимальная доля ванильного времени ломания (0.75 = ломать можно не быстрее 75%)
  min-break-time-ratio: 0.72
  # сколько блоков вокруг себя за 700мс = surround
  surround-blocks: 4
  # радиус нюкера
  nuker-radius: 5

# ---------- ПАКЕТЫ / АНТИКРАШ ----------
packets:
  enabled: true
  # общий лимит входящих пакетов в секунду
  max-total-per-second: 500
  limits:
    move: 60
    swing: 40
    dig: 45
    use-entity: 40
    window-click: 40
    creative: 12
    held-slot: 30
    payload: 30
    swap-hand: 20
    keepalive: 8
    sign: 6
    book: 4
    place: 40
  # книги
  max-book-pages: 50
  max-book-page-chars: 1000
  max-book-total-chars: 12000
  # предметы
  max-item-nbt-bytes: 20000
  max-enchant-level: 255
  max-anvil-name-chars: 48
  max-sign-line-chars: 100

# ---------- ЧАТ ----------
chat:
  min-message-interval-ms: 700
  max-message-chars: 256
  block-repeat-within-ms: 5000
  min-command-interval-ms: 400

# ---------- АНТИ ЛАГ-МАШИНА ----------
lag:
  enabled: true
  max-entities-per-chunk: 150
  max-items-per-chunk: 96
  max-tnt-per-chunk: 32
  max-falling-blocks-per-chunk: 64
  max-minecarts-per-chunk: 24
  max-armorstands-per-chunk: 40
  # срабатываний редстоуна в чанке за секунду
  max-redstone-per-chunk: 900
  # заморозка редстоуна в чанке (секунд) при превышении
  redstone-freeze-seconds: 20
  # передач хопперов в чанке за секунду
  max-hopper-moves-per-chunk: 400
  # порталов создаваемых в минуту одним игроком
  max-portals-per-minute: 6
  # прогрузок чанков одним игроком в секунду
  max-chunk-loads-per-second: 25
  # ограничение цепных взрывов
  max-explosions-per-second-per-chunk: 12
  # автоочистка дропа
  item-cleanup-seconds: 300
